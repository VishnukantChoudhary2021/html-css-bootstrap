<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
        }
        .container{
            width: 350px;
            height: 550px;
            background-color: orange;
            border: 2px solid brown;
            border-radius:180px 180px 0 0;
            padding: 150px 20px 20px;
            
        }
        .mba{
            justify-content: center;
            padding: 20px;
            margin: 20px;
            border: 10px dotted green;
        }
        .bba{
            
            justify-content: center;
            color: red;
            padding: 20px;
            margin: 20px;
            border: 10px dotted yellow;
        }
        .bca{
            justify-content: center;
            color: black;
            padding: 20px;
            margin: 20px;
            border: 10px dotted red;
        }
    </style>
</head>
<body>
    
    <div class="container">

       
        <div class="mba">MBA</div>
        <div class="bba">BBA</div>
        <div class="bca">BCA</div>


    </div>

</body>
</html>
