<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="">

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }
        body{
            background-color:#f5f5f5 ;
            font-family: Arial, Helvetica, sans-serif;
        }

        .nav{
            display: flex;
            align-items: stretch;
            
            justify-content: space-around;
            border-bottom: 5px solid black;
            width: 100%;
            box-shadow: 0px 2px 5px gray;
        }
        a:hover{
            background-color: green;
        }
        a{
            
            align-items: stretch;
            color:red;
            font-size: 20px;
            text-decoration: none;
            width: 70px;
            height: 50px;
            border: 2px solid green;
            border-right:2px solid yellow ;
            border-bottom:red ;
        }

/* Dropdown container */
.dropdown {
    position: relative;
}

/* Product link */
.dropdown > a {
    display: block;
    color: white;
    text-decoration: none;
    font-size: 25px;
    padding: 14px 22px;
    border-right: 2px solid #ddd;
}

/* Dropdown menu */
.dropdown-menu {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    min-width: 180px;
    background-color: #08080b;
    border-bottom: 4px solid #b85b1c;
    z-index: 1000;
}

/* Dropdown options */
.dropdown-menu a {
    display: block;
    color: white;
    text-decoration: none;
    font-size: 18px;
    padding: 12px 16px;
    border-bottom: 1px solid #555;
}

/* Hover effect */
.dropdown-menu a:hover {
    background-color: #333;
    color: #ff914d;
}

/* Show dropdown on hover */
.dropdown:hover .dropdown-menu {
    display: block;
}

/* Highlight Product on hover */
.dropdown:hover > a {
    background-color: #333;
    color: #ff914d;
}


    </style>
</head>
<body>
    <div class="nav">
<nav>
    <a href="#">home</a>
    <a href="#">about</a>
    <a href="#">service</a>
    <a href="#">contact</a>
    <div class="dropdown">
    <a href="#">Product</a>

    <div class="dropdown-menu">
        <a href="#">Furniture</a>
        <a href="#">Electronics</a>
    </div>
</div>
</nav>

    </div>
</body>
</html>
